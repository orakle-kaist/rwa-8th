asyncapi: 3.1.0
info:
  title: Korean Equity RWA PoC Event Contract
  version: 1.1.0
  description: |
    Ordered, signed and idempotent event contract. The application receives adapter
    facts and emits domain outcomes. Event bodies MUST contain no restricted PII.
defaultContentType: application/json
servers:
  local:
    host: localhost:9092
    protocol: kafka
    description: Logical local event bus; implementation product is replaceable.
channels:
  kycResults:
    address: rwa.kyc.results.v1
    messages:
      kycResultRecorded:
        $ref: "#/components/messages/KycResultRecorded"
  policyDecisions:
    address: rwa.policy.decisions.v1
    messages:
      policyDecisionRecorded:
        $ref: "#/components/messages/PolicyDecisionRecorded"
  accountLinkages:
    address: rwa.accounts.linkages.v1
    messages:
      accountLinkageChanged:
        $ref: "#/components/messages/AccountLinkageChanged"
  fundingConfirmations:
    address: rwa.funding.confirmations.v1
    messages:
      fundingConfirmed:
        $ref: "#/components/messages/FundingConfirmed"
  marketExecutions:
    address: rwa.market.executions.v1
    messages:
      marketExecutionRecorded:
        $ref: "#/components/messages/MarketExecutionRecorded"
  accountActivities:
    address: rwa.accounts.activities.v1
    messages:
      accountActivityRecorded:
        $ref: "#/components/messages/AccountActivityRecorded"
  custodySettlements:
    address: rwa.custody.settlements.v1
    messages:
      custodySettlementRecorded:
        $ref: "#/components/messages/CustodySettlementRecorded"
  reserveAttestations:
    address: rwa.reserve.attestations.v1
    messages:
      reserveAttestationRecorded:
        $ref: "#/components/messages/ReserveAttestationRecorded"
  custodyPositions:
    address: rwa.custody.positions.v1
    messages:
      custodyPositionUpdated:
        $ref: "#/components/messages/CustodyPositionUpdated"
  entitlementPositions:
    address: rwa.entitlement.positions.v1
    messages:
      entitlementPositionUpdated:
        $ref: "#/components/messages/EntitlementPositionUpdated"
  issuanceOutcomes:
    address: rwa.issuance.outcomes.v1
    messages:
      entitlementIssued:
        $ref: "#/components/messages/EntitlementIssued"
  tradeSettlements:
    address: rwa.trade.settlements.v1
    messages:
      tradeSettlementRecorded:
        $ref: "#/components/messages/TradeSettlementRecorded"
  corporateActions:
    address: rwa.corporate.actions.v1
    messages:
      corporateActionUpdated:
        $ref: "#/components/messages/CorporateActionUpdated"
  corporateActionAllocations:
    address: rwa.corporate.action.allocations.v1
    messages:
      corporateActionAllocationUpdated:
        $ref: "#/components/messages/CorporateActionAllocationUpdated"
  redemptions:
    address: rwa.redemptions.v1
    messages:
      redemptionUpdated:
        $ref: "#/components/messages/RedemptionUpdated"
  reconciliations:
    address: rwa.reconciliations.v1
    messages:
      reconciliationCompleted:
        $ref: "#/components/messages/ReconciliationCompleted"
  auditEvents:
    address: rwa.audit.events.v1
    messages:
      privilegedActionAudited:
        $ref: "#/components/messages/PrivilegedActionAudited"
  regulatoryReports:
    address: rwa.regulatory.reports.v1
    messages:
      regulatoryReportingEvidenceRecorded:
        $ref: "#/components/messages/RegulatoryReportingEvidenceRecorded"
operations:
  receiveKycResult:
    action: receive
    channel:
      $ref: "#/channels/kycResults"
    messages:
      - $ref: "#/channels/kycResults/messages/kycResultRecorded"
  receivePolicyDecision:
    action: receive
    channel:
      $ref: "#/channels/policyDecisions"
    messages:
      - $ref: "#/channels/policyDecisions/messages/policyDecisionRecorded"
  receiveAccountLinkage:
    action: receive
    channel:
      $ref: "#/channels/accountLinkages"
    messages:
      - $ref: "#/channels/accountLinkages/messages/accountLinkageChanged"
  receiveFundingConfirmation:
    action: receive
    channel:
      $ref: "#/channels/fundingConfirmations"
    messages:
      - $ref: "#/channels/fundingConfirmations/messages/fundingConfirmed"
  receiveMarketExecution:
    action: receive
    channel:
      $ref: "#/channels/marketExecutions"
    messages:
      - $ref: "#/channels/marketExecutions/messages/marketExecutionRecorded"
  receiveAccountActivity:
    action: receive
    channel:
      $ref: "#/channels/accountActivities"
    messages:
      - $ref: "#/channels/accountActivities/messages/accountActivityRecorded"
  receiveCustodySettlement:
    action: receive
    channel:
      $ref: "#/channels/custodySettlements"
    messages:
      - $ref: "#/channels/custodySettlements/messages/custodySettlementRecorded"
  receiveReserveAttestation:
    action: receive
    channel:
      $ref: "#/channels/reserveAttestations"
    messages:
      - $ref: "#/channels/reserveAttestations/messages/reserveAttestationRecorded"
  sendCustodyPosition:
    action: send
    channel:
      $ref: "#/channels/custodyPositions"
    messages:
      - $ref: "#/channels/custodyPositions/messages/custodyPositionUpdated"
  receiveEntitlementPosition:
    action: receive
    channel:
      $ref: "#/channels/entitlementPositions"
    messages:
      - $ref: "#/channels/entitlementPositions/messages/entitlementPositionUpdated"
  sendIssuanceOutcome:
    action: send
    channel:
      $ref: "#/channels/issuanceOutcomes"
    messages:
      - $ref: "#/channels/issuanceOutcomes/messages/entitlementIssued"
  sendTradeSettlement:
    action: send
    channel:
      $ref: "#/channels/tradeSettlements"
    messages:
      - $ref: "#/channels/tradeSettlements/messages/tradeSettlementRecorded"
  sendCorporateActionUpdate:
    action: send
    channel:
      $ref: "#/channels/corporateActions"
    messages:
      - $ref: "#/channels/corporateActions/messages/corporateActionUpdated"
  sendCorporateActionAllocation:
    action: send
    channel:
      $ref: "#/channels/corporateActionAllocations"
    messages:
      - $ref: "#/channels/corporateActionAllocations/messages/corporateActionAllocationUpdated"
  sendRedemptionUpdate:
    action: send
    channel:
      $ref: "#/channels/redemptions"
    messages:
      - $ref: "#/channels/redemptions/messages/redemptionUpdated"
  sendReconciliationResult:
    action: send
    channel:
      $ref: "#/channels/reconciliations"
    messages:
      - $ref: "#/channels/reconciliations/messages/reconciliationCompleted"
  sendAuditEvent:
    action: send
    channel:
      $ref: "#/channels/auditEvents"
    messages:
      - $ref: "#/channels/auditEvents/messages/privilegedActionAudited"
  receiveRegulatoryReportingEvidence:
    action: receive
    channel:
      $ref: "#/channels/regulatoryReports"
    messages:
      - $ref: "#/channels/regulatoryReports/messages/regulatoryReportingEvidenceRecorded"
components:
  messages:
    KycResultRecorded:
      name: KycResultRecorded
      title: A distributor recorded a signed KYC outcome without source PII
      payload:
        allOf:
          - $ref: ./schemas/domain.schema.json#/$defs/EventEnvelope
          - type: object
            properties:
              eventType: { const: KycResultRecorded }
              data:
                $ref: ./schemas/domain.schema.json#/$defs/KycResult
    PolicyDecisionRecorded:
      name: PolicyDecisionRecorded
      title: A versioned jurisdiction or KR asset decision was recorded
      payload:
        allOf:
          - $ref: ./schemas/domain.schema.json#/$defs/EventEnvelope
          - type: object
            properties:
              eventType: { const: PolicyDecisionRecorded }
              data:
                $ref: ./schemas/domain.schema.json#/$defs/PolicyDecision
    AccountLinkageChanged:
      name: AccountLinkageChanged
      title: A PII-free participant, entitlement account and dedicated wallet linkage changed
      payload:
        allOf:
          - $ref: ./schemas/domain.schema.json#/$defs/EventEnvelope
          - type: object
            properties:
              eventType: { const: AccountLinkageChanged }
              data:
                $ref: ./schemas/domain.schema.json#/$defs/AccountLinkageView
    FundingConfirmed:
      name: FundingConfirmed
      title: Bank and FX mock result
      payload:
        allOf:
          - $ref: ./schemas/domain.schema.json#/$defs/EventEnvelope
          - type: object
            properties:
              eventType: { const: FundingConfirmed }
              data:
                $ref: ./schemas/domain.schema.json#/$defs/FundingConfirmation
    MarketExecutionRecorded:
      name: MarketExecutionRecorded
      title: One KRX mock fill, correction or bust; never authorizes mint by itself
      payload:
        allOf:
          - $ref: ./schemas/domain.schema.json#/$defs/EventEnvelope
          - type: object
            properties:
              eventType: { const: MarketExecutionRecorded }
              data:
                $ref: ./schemas/domain.schema.json#/$defs/MarketExecution
    AccountActivityRecorded:
      name: AccountActivityRecorded
      title: An append-only financial-state account activity was recorded
      payload:
        allOf:
          - $ref: ./schemas/domain.schema.json#/$defs/EventEnvelope
          - type: object
            properties:
              eventType: { const: AccountActivityRecorded }
              data:
                $ref: ./schemas/domain.schema.json#/$defs/AccountActivity
    CustodySettlementRecorded:
      name: CustodySettlementRecorded
      title: KSD mock settlement result
      payload:
        allOf:
          - $ref: ./schemas/domain.schema.json#/$defs/EventEnvelope
          - type: object
            properties:
              eventType: { const: CustodySettlementRecorded }
              data:
                $ref: ./schemas/domain.schema.json#/$defs/CustodySettlement
    ReserveAttestationRecorded:
      name: ReserveAttestationRecorded
      title: Dual-approved custody and tokenized backing quantities
      payload:
        allOf:
          - $ref: ./schemas/domain.schema.json#/$defs/EventEnvelope
          - type: object
            properties:
              eventType: { const: ReserveAttestationRecorded }
              data:
                $ref: ./schemas/domain.schema.json#/$defs/ReserveAttestation
    CustodyPositionUpdated:
      name: CustodyPositionUpdated
      title: A settled, unsettled and allocated custody position projection changed
      payload:
        allOf:
          - $ref: ./schemas/domain.schema.json#/$defs/EventEnvelope
          - type: object
            properties:
              eventType: { const: CustodyPositionUpdated }
              data:
                $ref: ./schemas/domain.schema.json#/$defs/CustodyPositionView
    EntitlementPositionUpdated:
      name: EntitlementPositionUpdated
      title: A final-investor entitlement position changed in the foreign distributor book
      payload:
        allOf:
          - $ref: ./schemas/domain.schema.json#/$defs/EventEnvelope
          - type: object
            properties:
              eventType: { const: EntitlementPositionUpdated }
              data:
                $ref: ./schemas/domain.schema.json#/$defs/EntitlementPositionView
    EntitlementIssued:
      name: EntitlementIssued
      title: Mint outcome after settlement and reserve checks
      payload:
        allOf:
          - $ref: ./schemas/domain.schema.json#/$defs/EventEnvelope
          - type: object
            properties:
              eventType: { const: EntitlementIssued }
              data:
                type: object
                additionalProperties: false
                required: [issuanceId, orderId, instrumentId, participantId, quantity, ledgerTransactionHash]
                properties:
                  issuanceId:
                    $ref: ./schemas/domain.schema.json#/$defs/OpaqueId
                  orderId:
                    $ref: ./schemas/domain.schema.json#/$defs/OpaqueId
                  instrumentId:
                    $ref: ./schemas/domain.schema.json#/$defs/OpaqueId
                  participantId:
                    $ref: ./schemas/domain.schema.json#/$defs/OpaqueId
                  quantity:
                    $ref: ./schemas/domain.schema.json#/$defs/PositiveInteger
                  ledgerTransactionHash:
                    $ref: ./schemas/domain.schema.json#/$defs/Hash
    TradeSettlementRecorded:
      name: TradeSettlementRecorded
      title: Atomic DvP result
      payload:
        allOf:
          - $ref: ./schemas/domain.schema.json#/$defs/EventEnvelope
          - type: object
            properties:
              eventType: { const: TradeSettlementRecorded }
              data:
                $ref: ./schemas/domain.schema.json#/$defs/DvPResult
    CorporateActionUpdated:
      name: CorporateActionUpdated
      title: Cash dividend lifecycle transition
      payload:
        allOf:
          - $ref: ./schemas/domain.schema.json#/$defs/EventEnvelope
          - type: object
            properties:
              eventType: { const: CorporateActionUpdated }
              data:
                $ref: ./schemas/domain.schema.json#/$defs/CorporateAction
    CorporateActionAllocationUpdated:
      name: CorporateActionAllocationUpdated
      title: An investor or control-residual corporate action allocation changed
      payload:
        allOf:
          - $ref: ./schemas/domain.schema.json#/$defs/EventEnvelope
          - type: object
            properties:
              eventType: { const: CorporateActionAllocationUpdated }
              data:
                $ref: ./schemas/domain.schema.json#/$defs/CorporateActionAllocation
    RedemptionUpdated:
      name: RedemptionUpdated
      title: Redemption lifecycle transition
      payload:
        allOf:
          - $ref: ./schemas/domain.schema.json#/$defs/EventEnvelope
          - type: object
            properties:
              eventType: { const: RedemptionUpdated }
              data:
                $ref: ./schemas/domain.schema.json#/$defs/Redemption
    ReconciliationCompleted:
      name: ReconciliationCompleted
      title: Incremental, end-of-day or recovery reconciliation result
      payload:
        allOf:
          - $ref: ./schemas/domain.schema.json#/$defs/EventEnvelope
          - type: object
            properties:
              eventType: { const: ReconciliationCompleted }
              data:
                $ref: ./schemas/domain.schema.json#/$defs/ReconciliationResult
    PrivilegedActionAudited:
      name: PrivilegedActionAudited
      title: Immutable audit record for a privileged action
      payload:
        allOf:
          - $ref: ./schemas/domain.schema.json#/$defs/EventEnvelope
          - type: object
            properties:
              eventType: { const: PrivilegedActionAudited }
              data:
                $ref: ./schemas/domain.schema.json#/$defs/AuditEvent
    RegulatoryReportingEvidenceRecorded:
      name: RegulatoryReportingEvidenceRecorded
      title: Foreign omnibus monthly report submission and retention evidence was recorded
      payload:
        allOf:
          - $ref: ./schemas/domain.schema.json#/$defs/EventEnvelope
          - type: object
            properties:
              eventType: { const: RegulatoryReportingEvidenceRecorded }
              data:
                $ref: ./schemas/domain.schema.json#/$defs/RegulatoryReportingEvidence
