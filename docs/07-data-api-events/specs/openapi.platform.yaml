      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items, projection]
            properties:
              items:
                type: array
                items: { $ref: '#/components/schemas/MarketMakerPositionView' }
              projection: { $ref: './schemas/common.schema.json#/$defs/ProjectionMetadata' }
    MarketMakerHedgeList:
