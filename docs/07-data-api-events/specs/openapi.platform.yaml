openapi: 3.1.2
info:
  title: Korean Equity RWA PoC Platform API
  version: 1.0.0
  description: 합성 데이터만 사용하는 7단계 플랫폼 HTTP 계약이다. 상태변경 명령의 202 응답은 업무 완료가 아니다.
servers:
  - url: http://localhost:3000/api/v1
security:
  - syntheticBearer: []
tags:
  - name: CommonQueries
  - name: InvestorCommands
  - name: InstitutionCommands
  - name: AdapterIngress
paths:
  /session:
    get:
      tags: [CommonQueries]
      operationId: getSession
      summary: 현재 합성 사용자와 역할 조회
      responses:
        '200':
          description: 합성 사용자와 역할
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [actorId, role, simulation, projection]
                properties:
                  actorId: { type: string, format: uuid }
                  role: { type: string, pattern: '^[A-Z][A-Z0-9_]+$' }
                  institutionId: { type: string, format: uuid }
                  customerReadiness:
                    $ref: './schemas/domain.schema.json#/$defs/CustomerReadiness'
                  localPrimaryScenario:
                    $ref: '#/components/schemas/LocalPrimaryScenario'
                  localSecondaryScenario:
                    $ref: '#/components/schemas/LocalSecondaryScenario'
                  localRedemptionScenario:
                    $ref: '#/components/schemas/LocalRedemptionScenario'
                  localRightsScenario:
                    $ref: '#/components/schemas/LocalRightsScenario'
                  simulation: { const: true }
                  projection: { $ref: './schemas/common.schema.json#/$defs/ProjectionMetadata' }
        '401': { $ref: '#/components/responses/Error' }
  /products:
    get:
      tags: [CommonQueries]
      operationId: listProducts
      summary: 상품목록과 기능별 가능상태 조회
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 상품목록과 기능별 가능상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedProducts' }
  /products/{securityId}:
    get:
      tags: [CommonQueries]
      operationId: getProduct
      summary: 종목별 상품 상세 조회
      parameters:
        - $ref: '#/components/parameters/SecurityId'
      responses:
        '200':
          description: 상품 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/Error' }
  /positions:
    get:
      tags: [CommonQueries]
      operationId: listPositions
      summary: 고객 또는 기관 범위의 권리와 토큰 조회
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 고객 또는 역할 범위의 권리, 토큰과 지급청구 투영
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedPositions' }
  /activities:
    get:
      tags: [CommonQueries]
      operationId: listActivities
      summary: 주문과 권리 및 자금 활동내역 조회
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 역할 범위의 활동내역
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedActivities' }
  /workflows/{workflowId}:
    get:
      tags: [CommonQueries]
      operationId: getWorkflow
      summary: 업무의 독립 상태축 조회
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      responses:
        '200':
          description: 독립 상태축과 투영 완전성
          content:
            application/json:
              schema:
                $ref: './schemas/domain.schema.json#/$defs/WorkflowView'
        '404': { $ref: '#/components/responses/Error' }
  /workflows/{workflowId}/timeline:
    get:
      tags: [CommonQueries]
      operationId: getWorkflowTimeline
      summary: 업무 증거와 정정 흐름 조회
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      responses:
        '200':
          description: 명령, 기관사실, 승인, 체인결과와 정정 계보
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [workflowId, items, projection]
                properties:
                  workflowId: { type: string, format: uuid }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TimelineItem' }
                  projection:
                    $ref: './schemas/common.schema.json#/$defs/ProjectionMetadata'
  /disclosures/current:
    get:
      tags: [CommonQueries]
      operationId: getCurrentDisclosure
      summary: 현재 적용 위험공시와 책임기관 조회
      responses:
        '200':
          description: 현재 적용 위험공시
          content:
            application/json:
              schema: { $ref: './schemas/domain.schema.json#/$defs/Disclosure' }
        '404': { $ref: '#/components/responses/Error' }
  /disclosure-consents/current:
    get:
      tags: [CommonQueries]
      operationId: getCurrentDisclosureConsent
      summary: 현재 위험공시 동의의 유효 여부 조회
      responses:
        '200':
          description: 유효, 누락 또는 만료 상태
          content:
            application/json:
              schema: { $ref: './schemas/domain.schema.json#/$defs/DisclosureConsentView' }
  /disclosure-consents:
    post:
      tags: [InvestorCommands]
      operationId: createDisclosureConsent
      summary: 현재 위험공시에 전자 동의 제출
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas/domain.schema.json#/$defs/DisclosureConsentRequest' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /complaints:
    get:
      tags: [CommonQueries]
      operationId: listComplaints
      summary: 본인 또는 역할 범위의 민원 목록 조회
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 민원 목록
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, projection]
                properties:
                  items:
                    type: array
                    items: { $ref: './schemas/domain.schema.json#/$defs/ComplaintView' }
                  nextCursor: { type: string }
                  projection: { $ref: './schemas/common.schema.json#/$defs/ProjectionMetadata' }
    post:
      tags: [InvestorCommands]
      operationId: createComplaint
      summary: 투자자 민원 접수
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas/domain.schema.json#/$defs/ComplaintRequest' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /complaints/{complaintId}:
    get:
      tags: [CommonQueries]
      operationId: getComplaint
      summary: 본인 또는 담당 범위의 민원 상세 조회
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
      responses:
        '200':
          description: 책임기관, 답변, 정정과 종결 근거를 포함한 민원
          content:
            application/json:
              schema: { $ref: './schemas/domain.schema.json#/$defs/ComplaintView' }
        '404': { $ref: '#/components/responses/Error' }
  /wallet-link-requests:
    post:
      tags: [InvestorCommands]
      operationId: requestWalletLink
      summary: 고객 전용 지갑 연결 요청
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [wallet, ownershipSignature]
              properties:
                wallet: { $ref: './schemas/common.schema.json#/$defs/EvmAddress' }
                ownershipSignature: { type: string, pattern: '^0x[0-9a-fA-F]{130}$' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /wallet-replacement-requests:
    post:
      tags: [InvestorCommands]
      operationId: requestWalletReplacement
      summary: 고객 전용 지갑 교체 요청
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [oldWallet, newWallet, reasonKo, newWalletSignature]
              properties:
                oldWallet: { $ref: './schemas/common.schema.json#/$defs/EvmAddress' }
                newWallet: { $ref: './schemas/common.schema.json#/$defs/EvmAddress' }
                reasonKo: { type: string, minLength: 1, maxLength: 500 }
                newWalletSignature: { type: string, pattern: '^0x[0-9a-fA-F]{130}$' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /primary-orders:
    get:
      tags: [CommonQueries]
      operationId: listPrimaryOrders
      summary: 1차 발행 주문 목록 조회
      responses:
        '200': { $ref: '#/components/responses/PrimaryOrderList' }
    post:
      tags: [InvestorCommands]
      operationId: createPrimaryOrder
      summary: 1차 지정가 발행 주문 접수
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/domain.schema.json#/$defs/PrimaryOrderRequest'
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /primary-orders/{orderId}/cancellations:
    post:
      tags: [InvestorCommands]
      operationId: cancelPrimaryOrder
      summary: 1차 발행 주문 취소 요청
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reasonKo]
              properties:
                reasonKo: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '409': { $ref: '#/components/responses/Error' }
  /quotes:
    get:
      tags: [CommonQueries]
      operationId: listQuotes
      summary: 지정 시장조성자 호가 조회
      parameters:
        - $ref: '#/components/parameters/SecurityIdQuery'
        - name: investorSide
          in: query
          required: true
          schema: { $ref: './schemas/domain.schema.json#/$defs/InvestorSide' }
        - name: fundingMode
          in: query
          required: true
          schema: { type: string, enum: [USD_LEDGER, USDC_ONCHAIN] }
      responses:
        '200':
          description: 유효한 지정 시장조성자 호가
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedQuotes' }
  /secondary-orders:
    get:
      tags: [CommonQueries]
      operationId: listSecondaryOrders
      summary: 24시간 2차거래 주문 목록 조회
      responses:
        '200': { $ref: '#/components/responses/SecondaryOrderList' }
    post:
      tags: [InvestorCommands]
      operationId: createSecondaryOrder
      summary: 24시간 2차거래 주문 접수
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/domain.schema.json#/$defs/SecondaryOrderRequest'
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /redemptions:
    get:
      tags: [CommonQueries]
      operationId: listRedemptions
      summary: 환매 업무 목록 조회
      responses:
        '200': { $ref: '#/components/responses/RedemptionList' }
    post:
      tags: [InvestorCommands]
      operationId: createRedemption
      summary: 1차 환매 주문 접수
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/domain.schema.json#/$defs/RedemptionRequest'
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /redemptions/{redemptionId}/cancellations:
    post:
      tags: [InvestorCommands]
      operationId: cancelRedemption
      summary: 국내 매도 제출 전 환매 취소
      parameters:
        - $ref: '#/components/parameters/RedemptionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/domain.schema.json#/$defs/RedemptionCancellationRequest'
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /dividend-conversions:
    post:
      tags: [InvestorCommands]
      operationId: createDividendConversion
      summary: 지급된 배당의 USDC 전환 요청
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [dividendPaymentId, quoteId]
              properties:
                dividendPaymentId: { type: string, format: uuid }
                quoteId: { type: string, format: uuid }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /voting-instructions:
    post:
      tags: [InvestorCommands]
      operationId: submitVotingInstruction
      summary: 의결권 행사 지시 접수
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [meetingId, agendaId, instruction]
              properties:
                meetingId: { type: string, format: uuid }
                agendaId: { type: string, format: uuid }
                instruction: { type: string, enum: [FOR, AGAINST, ABSTAIN] }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /institution/tasks:
    get:
      tags: [InstitutionCommands]
      operationId: listInstitutionTasks
      summary: 기관 역할별 업무 대기열 조회
      responses:
        '200': { $ref: '#/components/responses/WorkflowList' }
  /institution/tasks/{taskId}/decisions:
    post:
      tags: [InstitutionCommands]
      operationId: decideInstitutionTask
      summary: 기관 업무 승인 또는 거절 기록
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/domain.schema.json#/$defs/InstitutionDecision'
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /market-maker/quotes:
    post:
      tags: [InstitutionCommands]
      operationId: publishMarketMakerQuote
      summary: 지정 시장조성자 호가 제출
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/domain.schema.json#/$defs/MarketMakerQuoteRequest'
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /market-maker/positions:
    get:
      tags: [InstitutionCommands]
      operationId: listMarketMakerPositions
      summary: 시장조성자 재고와 위험 조회
      responses:
        '200': { $ref: '#/components/responses/MarketMakerPositionList' }
  /market-maker/hedges:
    get:
      tags: [InstitutionCommands]
      operationId: listMarketMakerHedges
      summary: 다음 개장 헤지 대기열 조회
      responses:
        '200': { $ref: '#/components/responses/MarketMakerHedgeList' }
  /market-maker/hedges/{hedgeId}/decisions:
    post:
      tags: [InstitutionCommands]
      operationId: decideMarketMakerHedge
      summary: 시장조성자 헤지 제출 여부 결정
      parameters:
        - name: hedgeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas/domain.schema.json#/$defs/InstitutionDecision' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '409': { $ref: '#/components/responses/Error' }
  /reconciliations:
    post:
      tags: [InstitutionCommands]
      operationId: startReconciliation
      summary: 두 축 수량 대사 시작
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [asOf, scope]
              properties:
                asOf: { $ref: './schemas/common.schema.json#/$defs/UtcTimestamp' }
                scope: { type: string, enum: [SECURITY, CUSTOMER, SYSTEM] }
                securityId: { $ref: './schemas/common.schema.json#/$defs/SecurityId' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '409': { $ref: '#/components/responses/Error' }
  /holds:
    get:
      tags: [InstitutionCommands]
      operationId: listHolds
      summary: 고객과 종목 및 자금경로 중지 조회
      responses:
        '200': { $ref: '#/components/responses/WorkflowList' }
  /holds/{holdId}/release-decisions:
    post:
      tags: [InstitutionCommands]
      operationId: decideHoldRelease
      summary: 중지 해제 승인 또는 거절 기록
      parameters:
        - name: holdId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas/domain.schema.json#/$defs/InstitutionDecision' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '409': { $ref: '#/components/responses/Error' }
  /regulatory-reports:
    get:
      tags: [InstitutionCommands]
      operationId: listRegulatoryReports
      summary: 월별 최종투자자 보고 조회
      responses:
        '200': { $ref: '#/components/responses/WorkflowList' }
  /regulatory-reports/{reportId}/submission-results:
    post:
      tags: [InstitutionCommands]
      operationId: recordRegulatoryReportSubmission
      summary: 월별 보고 제출결과 기록
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [result, sourceMetadata]
              properties:
                result: { type: string, enum: [ACCEPTED, REJECTED, CORRECTION_REQUIRED] }
                sourceMetadata: { $ref: './schemas/common.schema.json#/$defs/SourceMetadata' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '409': { $ref: '#/components/responses/Error' }
  /institution/complaints/{complaintId}/assignments:
    post:
      tags: [InstitutionCommands]
      operationId: assignComplaint
      summary: 민원 책임기관 배정
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas/domain.schema.json#/$defs/ComplaintAssignment' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '409': { $ref: '#/components/responses/Error' }
  /institution/complaints/{complaintId}/responses:
    post:
      tags: [InstitutionCommands]
      operationId: recordComplaintResponse
      summary: 투자자에게 제공한 답변 참조 기록
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas/domain.schema.json#/$defs/ComplaintResponseRecord' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '409': { $ref: '#/components/responses/Error' }
  /institution/complaints/{complaintId}/processing-starts:
    post:
      tags: [InstitutionCommands]
      operationId: startComplaintProcessing
      summary: 배정된 책임기관의 민원 처리 시작
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas/domain.schema.json#/$defs/ComplaintProcessingStart' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '409': { $ref: '#/components/responses/Error' }
  /institution/complaints/{complaintId}/correction-links:
    post:
      tags: [InstitutionCommands]
      operationId: linkComplaintCorrection
      summary: 민원과 별도 정정 업무 연결
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas/domain.schema.json#/$defs/ComplaintCorrectionLink' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '409': { $ref: '#/components/responses/Error' }
  /institution/complaints/{complaintId}/closures:
    post:
      tags: [InstitutionCommands]
      operationId: closeComplaint
      summary: 답변과 정정 결과 확인 후 민원 종결
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas/domain.schema.json#/$defs/ComplaintClosure' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '409': { $ref: '#/components/responses/Error' }
  /adapter-events:
    post:
      tags: [AdapterIngress]
      operationId: receiveAdapterEvent
      summary: 서명된 모의 기관 결과 접수
      security:
        - adapterSignature: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas/domain.schema.json#/$defs/AdapterEventInput' }
      responses:
        '202':
          description: 검증과 비동기 소비를 위해 접수됨. 중복이면 기존 결과를 가리킨다.
          content:
            application/json:
              schema: { $ref: './schemas/common.schema.json#/$defs/AcceptedCommand' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    syntheticBearer:
      type: http
      scheme: bearer
      bearerFormat: Synthetic-JWT
    adapterSignature:
      type: apiKey
      in: header
      name: X-Adapter-Key-Id
      description: 본문 안의 Ed25519 signature와 함께 검증한다.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, minLength: 1, maxLength: 512 }
    WorkflowId:
      name: workflowId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RedemptionId:
      name: redemptionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ComplaintId:
      name: complaintId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SecurityId:
      name: securityId
      in: path
      required: true
      schema: { $ref: './schemas/common.schema.json#/$defs/SecurityId' }
    SecurityIdQuery:
      name: securityId
      in: query
      required: true
      schema: { $ref: './schemas/common.schema.json#/$defs/SecurityId' }
  responses:
    PrimaryOrderList:
      description: 로컬 합성 1차 주문과 독립 상태축
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items, projection]
            properties:
              items:
                type: array
                items: { $ref: '#/components/schemas/PrimaryOrderView' }
              projection: { $ref: './schemas/common.schema.json#/$defs/ProjectionMetadata' }
    Accepted:
      description: 비동기 업무 접수
      content:
        application/json:
          schema: { $ref: './schemas/common.schema.json#/$defs/AcceptedCommand' }
    Error:
      description: 안정적인 기계 오류와 한국어 다음 행동
      content:
        application/json:
          schema: { $ref: './schemas/common.schema.json#/$defs/ErrorResponse' }
    WorkflowList:
      description: 역할 범위의 업무 투영 목록
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items, projection]
            properties:
              items:
                type: array
                items: { $ref: './schemas/domain.schema.json#/$defs/WorkflowView' }
              projection: { $ref: './schemas/common.schema.json#/$defs/ProjectionMetadata' }
    SecondaryOrderList:
      description: 로컬 합성 24시간 주문과 권리·토큰·자금 반영 상태
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items, projection]
            properties:
              items:
                type: array
                items: { $ref: '#/components/schemas/SecondaryOrderView' }
              projection: { $ref: './schemas/common.schema.json#/$defs/ProjectionMetadata' }
    RedemptionList:
      description: 환매 요청부터 지급청구, 소각과 USD 지급까지의 투영 목록
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items, projection]
            properties:
              items:
                type: array
                items: { $ref: '#/components/schemas/RedemptionView' }
              projection: { $ref: './schemas/common.schema.json#/$defs/ProjectionMetadata' }
    MarketMakerPositionList:
