[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
cache_path = "contracts/cache"
broadcast = "contracts/broadcast"
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = true
ffi = false

[[profile.default.fs_permissions]]
access = "read"
path = "node_modules/@safe-global/safe-contracts/build/artifacts"

remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@safe-global/safe-contracts/=node_modules/@safe-global/safe-contracts/contracts/"
]

[profile.ci]
fuzz = { runs = 256 }
invariant = { runs = 128, depth = 64, fail_on_revert = false }
