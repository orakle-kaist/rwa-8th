<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>외국인 투자자를 위한 한국 주식 RWA — 규제부터 거래까지</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
  :root{
    --paper:#faf6f2; --paper2:#f3ece5; --card:#ffffff; --line:#e7ddd4; --line-soft:#f0e8e0;
    --ink:#22201e; --ink-2:#544e48; --ink-3:#8a8078; --ink-faint:#b3a89e;
    --coral:#e8613c; --coral-deep:#c9451f; --coral-soft:#fdeee8; --coral-line:#f4c9b8;
    --teal:#2f7d7a; --teal-soft:#e5f0ef;
    --gold:#b8862e; --gold-soft:#f7efdd;
    --violet:#7b5ea7; --violet-soft:#efe9f5;
    --green:#3f8f4e; --green-soft:#e8f2e8; --red:#c0392b; --red-soft:#fbeae7;
    --mono:'SF Mono','D2Coding',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace;
    --sans:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --maxw:1180px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  /* Korean line-breaking: break at word/phrase boundaries, never mid-word */
  body,.big-q,.cap,.narr h2,.narr p,.tradfi,.crow .cd,.crow .cl,.split li,.trio .gt,.trio .gd,.trio .verdict,
  .std .std-q,.std .s li,.tl .qs .q .qh,.tl .qs .q .qd,.safe .sc .sd,.safe .sc .sh,.arch .lyr .lb,.arch .lyr .lh,
  .hero-scene h1,.hero-scene .lede,.journey .j .jt,.journey .j .jd,.actor .name,.actor .role,.stage-eyebrow,
  .metric .label,.narr .sn,.sc,.kbd,.act-tab .al,.scenario .r .v2,.tl .stop .l{
    word-break:keep-all;overflow-wrap:break-word;line-break:strict}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    background-image:radial-gradient(circle at 12% -5%,rgba(232,97,60,.05),transparent 34%),
                     radial-gradient(circle at 92% 8%,rgba(47,125,122,.04),transparent 38%);
    background-attachment:fixed;min-height:100vh}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:26px 24px 60px}

  /* ---------- top bar: act tracker ---------- */
  .topbar{display:flex;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .brand{font-weight:800;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
  .brand .c{color:var(--coral)}
  .acts{display:flex;gap:6px;flex:1;min-width:260px}
  .act-tab{flex:1;border:1px solid var(--line);border-radius:9px;padding:7px 8px 8px;background:var(--card);
    transition:.25s;cursor:pointer;text-align:left;position:relative;overflow:hidden}
  .act-tab .an{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--ink-faint)}
  .act-tab .al{font-size:12px;font-weight:700;letter-spacing:-.01em;margin-top:2px;color:var(--ink-3)}
  .act-tab.on{border-color:var(--coral);background:var(--coral-soft)}
  .act-tab.on .an{color:var(--coral)} .act-tab.on .al{color:var(--coral-deep)}
  .act-tab.done .al{color:var(--ink)}
  .act-tab.done .an{color:var(--ink-3)}
  .act-tab .bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--coral);transition:width .4s}
  @media(max-width:620px){.act-tab .al{font-size:10.5px}.brand{font-size:13px}}

  /* fine progress rail */
  .rail{display:flex;gap:3px;margin-bottom:22px}
  .rail .seg{flex:1;height:3px;border-radius:2px;background:var(--line);transition:background .3s}
  .rail .seg.done{background:var(--coral-line)}
  .rail .seg.active{background:var(--coral)}

  /* ---------- main split: stage / narrative ---------- */
  .grid{display:grid;grid-template-columns:1fr 380px;gap:22px;align-items:stretch}
  @media(max-width:880px){.grid{grid-template-columns:1fr}}

  .stage{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 30px;
    min-height:min(64vh,560px);position:relative;overflow:hidden;display:flex;flex-direction:column}
  .stage .scene{margin:auto 0}
  .stage-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--coral);margin-bottom:18px;display:flex;align-items:center;gap:8px}
  .stage-eyebrow .tag{padding:2px 8px;border-radius:20px;border:1px solid var(--coral-line);background:var(--coral-soft);font-size:9px}

  /* --- scene builder primitives --- */
  .scene{opacity:0;transform:translateY(6px);animation:sceneIn .45s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes sceneIn{to{opacity:1;transform:none}}
  .big-q{font-size:clamp(25px,3.8vw,34px);font-weight:800;letter-spacing:-.02em;line-height:1.18;max-width:20ch}
  .big-q em{font-style:normal;color:var(--coral);position:relative;white-space:nowrap}
  .big-q em::after{content:"";position:absolute;left:0;right:0;bottom:.05em;height:.11em;background:var(--coral-line);z-index:-1;border-radius:2px}
  .scene .cap{font-size:15.5px;color:var(--ink-2);margin-top:16px;max-width:58ch;line-height:1.6}
  .scene .cap b{color:var(--ink);font-weight:600}

  /* gate trio (who can hold) */
  .trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
  @media(max-width:520px){.trio{grid-template-columns:1fr}}
  .trio .g{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--paper);text-align:center;position:relative}
  .trio .g .ic{font-size:22px} .trio .g .gt{font-size:13px;font-weight:700;margin-top:6px}
  .trio .g .gd{font-size:11px;color:var(--ink-3);margin-top:3px;line-height:1.35}
  .trio .g .chk{position:absolute;top:8px;right:9px;color:var(--green);font-size:13px;opacity:0;transform:scale(.6);transition:.3s}
  .trio .g.pass .chk{opacity:1;transform:none}
  .trio .g.pass{border-color:var(--green);background:var(--green-soft)}
  .trio .verdict{grid-column:1/-1;text-align:center;font-size:13px;color:var(--ink-2);margin-top:2px}
  .trio .verdict b{color:var(--coral-deep)}

  /* contrast rows (traditional vs token vs ours) */
  .contrast{display:flex;flex-direction:column;gap:10px;margin-top:20px}
  .crow{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;border:1px solid var(--line);
    border-radius:11px;padding:12px 15px;background:var(--paper)}
  .crow .cl{font-size:12.5px;font-weight:700;color:var(--ink)}
  .crow .cl .cs{display:block;font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);font-weight:400;margin-top:2px}
  .crow .cd{font-size:12.5px;color:var(--ink-2)}
  .crow.bad{border-color:var(--red-soft);background:var(--red-soft)} .crow.bad .cl{color:var(--red)}
  .crow.good{border-color:var(--coral-line);background:var(--coral-soft)} .crow.good .cl{color:var(--coral-deep)}
  @media(max-width:520px){.crow{grid-template-columns:1fr;gap:4px}}

  /* off/on split */
  .split{display:grid;grid-template-columns:1fr 40px 1fr;gap:0;margin-top:20px;align-items:stretch}
  @media(max-width:560px){.split{grid-template-columns:1fr}}
  .split .col{border:1px solid var(--line);border-radius:12px;padding:15px}
  .split .off{border-color:var(--teal);background:linear-gradient(180deg,var(--teal-soft),var(--card) 65%)}
  .split .on{border-color:var(--coral-line);background:linear-gradient(180deg,var(--coral-soft),var(--card) 65%)}
  .split .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:10px}
  .split .off .lbl{color:var(--teal)} .split .on .lbl{color:var(--coral-deep)}
  .split ul{list-style:none;display:flex;flex-direction:column;gap:8px}
  .split li{font-size:12.5px;color:var(--ink-2);padding-left:15px;position:relative}
  .split li::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%}
  .split .off li::before{background:var(--teal)} .split .on li::before{background:var(--coral)}
  .split li b{color:var(--ink);font-weight:600}
  .split .mid{display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:18px}
  @media(max-width:560px){.split .mid{padding:6px 0;transform:rotate(90deg)}}

  /* ledger chain diagram (before vs token-security) */
  .chains{display:grid;grid-template-columns:1fr 44px 1fr;gap:0;margin-top:22px;align-items:start}
  @media(max-width:600px){.chains{grid-template-columns:1fr;gap:14px}}
  .chain{border:1px solid var(--line);border-radius:13px;padding:16px 14px 18px;background:var(--card)}
  .chain.old{background:linear-gradient(180deg,var(--paper2),var(--card) 55%)}
  .chain.new{border-color:var(--coral-line);background:linear-gradient(180deg,var(--coral-soft),var(--card) 55%)}
  .chain .clbl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:12px;text-align:center}
  .chain.old .clbl{color:var(--ink-3)} .chain.new .clbl{color:var(--coral-deep)}
  .chain .node{border:1px solid var(--line);border-radius:9px;padding:8px 10px;text-align:center;font-size:12.5px;font-weight:600;background:var(--card);position:relative;letter-spacing:-.01em}
  .chain .node .sub{display:block;font-family:var(--mono);font-size:9px;color:var(--ink-faint);font-weight:400;margin-top:2px;letter-spacing:0}
  .chain .node.hl{border-color:var(--coral);background:var(--coral-soft);color:var(--coral-deep);box-shadow:0 0 0 1px var(--coral)}
  .chain .node.muted{border-style:dashed;color:var(--ink-faint);font-weight:400;background:transparent}
  .chain .conn{height:16px;width:2px;background:var(--line);margin:0 auto}
  .chain.new .conn{background:var(--coral-line)}
  .chains .midx{display:flex;align-items:center;justify-content:center;padding-top:60px;color:var(--coral);font-size:20px}
  @media(max-width:600px){.chains .midx{padding:0;transform:rotate(90deg)}}

  /* timeline (KSD settlement) */
  .tl{margin-top:22px}
  .tl .track{display:flex;align-items:center;gap:0;position:relative}
  .tl .stop{flex:1;text-align:center;position:relative;z-index:2}
  .tl .stop .dot{width:14px;height:14px;border-radius:50%;background:var(--card);border:2px solid var(--coral-line);margin:0 auto 8px;transition:.3s}
  .tl .stop.hot .dot{background:var(--coral);border-color:var(--coral);box-shadow:0 0 0 4px var(--coral-soft)}
  .tl .stop .d{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--coral-deep)}
  .tl .stop .l{font-size:11px;color:var(--ink-3);margin-top:2px}
  .tl .line{position:absolute;top:6px;left:8%;right:8%;height:2px;background:var(--coral-line);z-index:1}
  .tl .qs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
  @media(max-width:520px){.tl .qs{grid-template-columns:1fr}}
  .tl .qs .q{border:1px solid var(--gold-soft);background:var(--gold-soft);border-radius:11px;padding:12px 14px}
  .tl .qs .q .qh{font-size:13px;font-weight:700;color:var(--gold);margin-bottom:3px}
  .tl .qs .q .qd{font-size:11.5px;color:var(--ink-2)}

  /* two-standard split */
  .std{display:grid;grid-template-columns:1fr 44px 1fr;gap:0;margin-top:22px;align-items:stretch}
  @media(max-width:560px){.std{grid-template-columns:1fr}}
  .std .s{border:1px solid var(--line);border-radius:13px;padding:18px;background:var(--paper)}
  .std .s.who{border-top:4px solid var(--coral)} .std .s.when{border-top:4px solid var(--teal)}
  .std .s .qword{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  .std .s.who .qword{color:var(--coral)} .std .s.when .qword{color:var(--teal)}
  .std .s .std-name{font-size:19px;font-weight:800;margin:5px 0 8px;letter-spacing:-.01em}
  .std .s .std-q{font-size:13.5px;color:var(--ink);font-weight:600;margin-bottom:8px}
  .std .s ul{list-style:none;display:flex;flex-direction:column;gap:6px}
  .std .s li{font-size:12px;color:var(--ink-2);padding-left:14px;position:relative}
  .std .s li::before{content:"·";position:absolute;left:2px;color:var(--ink-faint);font-weight:700}
  .std .x{display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:var(--ink-faint)}
  @media(max-width:560px){.std .x{padding:8px 0}}

  /* actor lanes (lifecycle stage) */
  .lanes{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;position:relative;margin-top:8px}
  .lane{text-align:center}
  .actor{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:18px 8px;
    transition:all .35s cubic-bezier(.4,0,.2,1);position:relative}
  .actor.active{border-color:var(--coral);box-shadow:0 0 0 1px var(--coral),0 8px 20px -10px rgba(232,97,60,.5);transform:translateY(-2px);background:var(--coral-soft)}
  .actor.dim{opacity:.4}
  .actor .icon{font-size:27px;line-height:1;display:block}
  .actor .name{font-size:13.5px;font-weight:700;margin-top:8px;letter-spacing:-.01em}
  .actor .role{font-family:var(--mono);font-size:9px;color:var(--ink-faint);margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
  .actor .bal{font-family:var(--mono);font-size:11px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line-soft);color:var(--ink-3);min-height:16px}
  .actor .bal b{color:var(--green)} .actor .bal .tk{color:var(--teal)}
  .flowmsg{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10px;
    background:var(--coral);color:#fff;padding:3px 10px;border-radius:12px;white-space:nowrap;opacity:0;
    transition:opacity .3s;font-weight:600;z-index:5;pointer-events:none;box-shadow:0 4px 12px -4px rgba(232,97,60,.5)}
  .flowmsg.show{opacity:1}

  .offchain{margin-top:14px;border:1px dashed var(--line);border-radius:11px;padding:0;max-height:0;overflow:hidden;opacity:0;transition:all .4s}
  .offchain.show{max-height:130px;opacity:1;padding:13px 15px}
  .offchain .oc-head{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;color:var(--ink-faint);font-family:var(--mono);text-transform:uppercase;letter-spacing:.09em;margin-bottom:9px}
  .clock{display:flex;align-items:center;gap:10px}
  .clock .bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
  .clock .fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--green));transition:width 1.1s linear}
  .clock .t{font-family:var(--mono);font-size:11px;color:var(--gold);min-width:60px;text-align:right}

  .gates{display:flex;gap:7px;margin-top:16px;flex-wrap:wrap;min-height:30px;align-items:center}
  .gate{font-family:var(--mono);font-size:11px;padding:5px 11px;border-radius:7px;border:1px solid var(--line);
    color:var(--ink-faint);display:flex;align-items:center;gap:5px;transition:all .3s;opacity:0;transform:translateY(4px)}
  .gate.show{opacity:1;transform:none}
  .gate.pass{border-color:var(--green);color:var(--green);background:var(--green-soft)}

  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:20px}
  @media(max-width:520px){.metrics{grid-template-columns:1fr 1fr}}
  .metric{background:var(--paper);border:1px solid var(--line-soft);border-radius:11px;padding:13px 15px}
  .metric .label{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint)}
  .metric .val{font-family:var(--mono);font-size:21px;font-weight:600;margin-top:5px;letter-spacing:-.02em}
  .metric .val.shares{color:var(--teal)} .metric .val.usdc{color:var(--green)}
  .metric .val.div{color:var(--gold)} .metric .val.cap{color:var(--ink)}
  .metric .val .u{font-size:11px;color:var(--ink-faint);font-weight:400}

  /* agent inequality + ladder */
  .neq{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;font-family:var(--mono);font-size:12.5px;align-items:center}
  .neq .pill{padding:6px 11px;border-radius:8px;font-weight:600}
  .neq .pill.a{background:var(--green-soft);color:var(--green)}
  .neq .pill.b{background:var(--teal-soft);color:var(--teal)}
  .neq .pill.c{background:var(--gold-soft);color:var(--gold)}
  .neq .pill.d{background:var(--coral-soft);color:var(--coral-deep)}
  .neq .ne{color:var(--red);font-weight:800;font-size:14px}
  .safe{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
  @media(max-width:520px){.safe{grid-template-columns:1fr}}
  .safe .sc{border:1px solid var(--line);border-radius:12px;padding:14px 15px;background:var(--paper)}
  .safe .sc .sh{font-size:13px;font-weight:700;margin-bottom:5px;display:flex;align-items:center;gap:7px}
  .safe .sc .sh .b{width:8px;height:8px;border-radius:2px;background:var(--coral)}
  .safe .sc .sd{font-size:12px;color:var(--ink-2)}
  .safe .sc .sd b{color:var(--ink);font-weight:600}

  /* agent natural-language UX chat mock */
  .chat{margin-top:20px;display:flex;flex-direction:column;gap:11px;max-width:560px}
  .bub{max-width:82%;padding:11px 15px;border-radius:15px;font-size:13.5px;line-height:1.5;position:relative}
  .bub.user{align-self:flex-end;background:var(--coral);color:#fff;border-bottom-right-radius:5px}
  .bub.agent{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px;color:var(--ink)}
  .bub .who{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-bottom:4px;display:block}
  .bub.agent b{color:var(--coral-deep)}
  .bub.user b{color:#fff;text-decoration:underline;text-underline-offset:2px}
  /* agent parses intent → checks chips */
  .parse{align-self:flex-start;max-width:88%;background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:11px 13px;font-size:12px;color:var(--ink-2)}
  .parse .pl{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px}
  .parse .fields{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
  .parse .f{font-family:var(--mono);font-size:11px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
  .parse .f b{color:var(--coral-deep)}
  .parse .checks{display:flex;flex-wrap:wrap;gap:6px}
  .parse .ck{font-family:var(--mono);font-size:10.5px;padding:3px 9px;border-radius:20px;background:var(--green-soft);color:var(--green);display:flex;align-items:center;gap:4px}

  /* two-column "말은 자유롭게 / 규칙은 그대로" */
  .uxsplit{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
  @media(max-width:520px){.uxsplit{grid-template-columns:1fr}}
  .uxsplit .uc{border:1px solid var(--line);border-radius:13px;padding:16px 17px;background:var(--paper)}
  .uxsplit .uc.free{border-color:var(--coral-line);background:linear-gradient(180deg,var(--coral-soft),var(--paper) 60%)}
  .uxsplit .uc.rule{border-color:var(--teal);background:linear-gradient(180deg,var(--teal-soft),var(--paper) 60%)}
  .uxsplit .uc .uh{font-size:15px;font-weight:800;letter-spacing:-.01em;margin-bottom:8px}
  .uxsplit .uc.free .uh{color:var(--coral-deep)} .uxsplit .uc.rule .uh{color:var(--teal)}
  .uxsplit .uc ul{list-style:none;display:flex;flex-direction:column;gap:8px}
  .uxsplit .uc li{font-size:12.5px;color:var(--ink-2);padding-left:16px;position:relative}
  .uxsplit .uc li::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%}
  .uxsplit .uc.free li::before{background:var(--coral)} .uxsplit .uc.rule li::before{background:var(--teal)}
  .uxsplit .uc li b{color:var(--ink);font-weight:600}

  /* final arch recap */
  .arch{display:flex;flex-direction:column;gap:9px;margin-top:20px}
  .arch .lyr{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:12px 15px;background:var(--paper)}
  .arch .lyr .lh{font-size:13.5px;font-weight:700} .arch .lyr .lh .ls{display:block;font-family:var(--mono);font-size:10px;color:var(--ink-3);font-weight:400;margin-top:2px}
  .arch .lyr .lb{font-size:12px;color:var(--ink-2)}

  /* intro / outro full scenes */

  .journey{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:24px}

  .journey .j .jn{font-family:var(--mono);font-size:9px;color:var(--coral);letter-spacing:.06em}

  .scenario{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}

  .scenario .r .k2{font-family:var(--mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint)}
  .scenario .r .v2{font-size:12.5px;font-weight:600;margin-top:2px;letter-spacing:-.01em}

  /* ---------- side narrative panel ---------- */
  .side{display:flex;flex-direction:column;gap:14px;position:sticky;top:20px}

  .narr{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px}
  .narr .sn{font-family:var(--mono);font-size:11px;color:var(--coral);letter-spacing:.1em}

  .narr p .fn{font-family:var(--mono);font-size:12.5px;color:var(--coral-deep);background:var(--coral-soft);padding:1px 6px;border-radius:5px}
  .tradfi{background:var(--paper2);border-left:3px solid var(--teal);border-radius:7px;padding:12px 14px;font-size:13px;color:var(--ink-2);line-height:1.55}
  .tradfi b{color:var(--teal);display:block;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}

  .controls{display:flex;gap:9px;align-items:center}
  button{font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;border-radius:10px;padding:12px 18px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);transition:all .16s}
  button:hover:not(:disabled){border-color:var(--coral-line);background:var(--paper)}
  button:disabled{opacity:.32;cursor:not-allowed}
  button.primary{background:var(--coral);color:#fff;border-color:var(--coral);flex:1}
  button.primary:hover:not(:disabled){background:var(--coral-deep);box-shadow:0 6px 18px -8px rgba(232,97,60,.6)}
  button.ghost{background:transparent}
  .sc{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);text-align:center;margin-top:2px}
  .kbd{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);text-align:center}
  .kbd b{color:var(--ink-3);background:var(--paper2);padding:1px 5px;border-radius:4px;border:1px solid var(--line)}

  .pulse{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <!-- act tracker -->
  <div class="topbar">
    <div class="brand">한국 주식 <span class="c">RWA</span> 사이클</div>
    <div class="acts" id="acts">
      <div class="act-tab" data-act="0"><div class="an">ACT 1</div><div class="al">규제</div><div class="bar"></div></div>
      <div class="act-tab" data-act="1"><div class="an">ACT 2</div><div class="al">인프라</div><div class="bar"></div></div>

      <div class="act-tab" data-act="3"><div class="an">ACT 4</div><div class="al">AI 에이전트</div><div class="bar"></div></div>
    </div>
  </div>

  <div class="rail" id="rail"></div>

  <div class="grid">
    <!-- STAGE -->

    <!-- SIDE -->

</div>

<script>
// ================= scene templates =================
const SCENES = {

  intro: ()=>`
    <div class="stage-eyebrow">규제부터 거래까지 <span class="tag">전체 사이클</span></div>
    <div class="scene hero-scene">
      <div class="k">외국인 투자자 · 한국 주식 · POC</div>
      <h1>Alice가 SK하이닉스 주식에 <em>온체인</em>으로 닿기까지</h1>
      <p class="lede">두바이의 <b>Alice</b>가 한국 주식을 사려 합니다. 규제가 무엇을 요구하는지에서 출발해, 그 위에 올릴 인프라, 실제 토큰의 발행과 거래, 마지막으로 AI 에이전트로 <b>말하듯 사고파는</b> 경험까지 — 네 개 트랙을 <b>하나의 흐름</b>으로 이어붙였습니다.</p>
      <div class="scenario">
        <div class="r"><div class="k2">투자자</div><div class="v2">Alice · 두바이</div></div>
        <div class="r"><div class="k2">기초자산</div><div class="v2">SK하이닉스</div></div>
        <div class="r"><div class="k2">납입 약정</div><div class="v2">10,000 USDC</div></div>
        <div class="r"><div class="k2">배당 원천징수</div><div class="v2">조세조약 적용 (예시)</div></div>
      </div>
      <div class="journey">
        <div class="j"><div class="jn">ACT 1</div><div class="jt">규제</div><div class="jd">누가 사고팔 수 있는가</div></div>
        <div class="j"><div class="jn">ACT 2</div><div class="jt">인프라</div><div class="jd">어디에 올리고 어떻게 결제하나</div></div>
        <div class="j"><div class="jn">ACT 3</div><div class="jt">토큰화·커스터디</div><div class="jd">발행부터 환매까지의 한 바퀴</div></div>
        <div class="j"><div class="jn">ACT 4</div><div class="jt">AI 에이전트</div><div class="jd">말 한마디로 사고팔기</div></div>
      </div>
    </div>`,

  // ---------- ACT 1 : 규제 ----------
  accessMethods: ()=>`
    <div class="stage-eyebrow">ACT 1 · 규제 <span class="tag">지금은 어떻게</span></div>
    <div class="scene">
      <div class="big-q">지금 외국인이 한국 주식을 <em>사는 법</em></div>
      <p class="cap">Alice에게 열려 있는 길은 크게 셋입니다. 그런데 셋 다 마찰이 크거나, 누군가의 협조에 의존합니다.</p>
      <div class="trio">
        <div class="g"><div class="ic">🏦</div><div class="gt">직접투자</div><div class="gd">국내 증권사 계좌 개설 · 상임대리인 · 서류 공증 · 환전 — <b>절차가 무겁다</b></div></div>
        <div class="g"><div class="ic">🔗</div><div class="gt">외국인 통합계좌</div><div class="gd">해외 증권사 명의 계좌로 일괄 주문 — 편하지만 <b>내 증권사가 열어야</b> 하고 명의는 브로커</div></div>
        <div class="g"><div class="ic">🇺🇸</div><div class="gt">ADR · 예탁증서</div><div class="gd">해외 거래소에서 달러로 매매 — <b>발행회사가 상장한 종목만</b> 존재</div></div>
        <div class="verdict">셋 다 마찰이 크거나 <b>남의 협조에 의존</b> — 임의 종목에 바로 접근하긴 어렵다</div>
      </div>
    </div>`,

  whoCanBuy: (revealed=99)=>`
    <div class="stage-eyebrow">ACT 1 · 규제 <span class="tag">누가</span></div>
    <div class="scene">
      <div class="big-q">한국 주식은 <em>아무나 못 산다</em></div>
      <p class="cap">Alice가 적격 투자자여도, 세 개의 관문을 <b>모두</b> 통과해야 보유·이전할 수 있습니다. 하나라도 막히면 거래는 성립하지 않습니다.</p>
      <div class="trio">
        <div class="g ${revealed>=1?'pass':''}"><span class="chk">✓</span><div class="ic">🪪</div><div class="gt">신원 확인 · 계좌</div><div class="gd">여권번호 식별 + 특금법 고객확인 (KYC)</div></div>
        <div class="g ${revealed>=2?'pass':''}"><span class="chk">✓</span><div class="ic">💱</div><div class="gt">외국환 신고·환전</div><div class="gd">외국환거래법상 자금 유출입·원화 환전</div></div>
        <div class="g ${revealed>=3?'pass':''}"><span class="chk">✓</span><div class="ic">📊</div><div class="gt">외국인 지분 한도</div><div class="gd">종목별 법정 상한 (예: KT·한전 49%)</div></div>
        <div class="verdict">세 가지를 <b>모두 통과한 사람만</b> 보유·이전할 수 있다</div>
      </div>
    </div>`,

  issuerAccountInstitution: ()=>`
    <div class="stage-eyebrow">ACT 1 · 규제 <span class="tag">핵심 결론</span></div>
    <div class="scene">
      <div class="big-q">발행인계좌관리기관이 되어 <em>진짜 주식</em>을 올린다</div>
      <p class="cap">한국 상장주식의 권리 이전은 전자등록계좌부에서만 효력이 생깁니다(전자증권법 §35②). 열쇠는 <b>누가 그 계좌부를 운영하느냐</b>입니다. 계좌관리기관 자리를 발행회사가 직접 맡으면, 그 원장이 온체인으로 내려옵니다.</p>
      <div class="chains">
        <div class="chain old">
          <div class="clbl">기존 · 주식</div>
          <div class="node">발행기관</div>
          <div class="conn"></div>
          <div class="node">명의개서대리인</div>
          <div class="conn"></div>
          <div class="node">KSD</div>
          <div class="conn"></div>
          <div class="node hl">일반계좌관리기관<span class="sub">= 증권사</span></div>
          <div class="conn"></div>
          <div class="node">투자자</div>
        </div>
        <div class="midx">→</div>
        <div class="chain new">
          <div class="clbl">토큰증권</div>
          <div class="node">발행기관</div>
          <div class="conn"></div>
          <div class="node muted">명의개서대리인<span class="sub">없거나 역할 축소</span></div>
          <div class="conn"></div>
          <div class="node">KSD</div>
          <div class="conn"></div>
          <div class="node hl">발행인계좌관리기관<span class="sub">= 온체인 분산원장</span></div>
          <div class="conn"></div>
          <div class="node">투자자</div>
        </div>
      </div>
      <div class="trio" style="margin-top:16px"><div class="verdict">증권사 자리를 발행회사가 대신하고, 그 계좌부가 곧 온체인 원장 — 토큰은 <b>전자등록주식 그 자체</b>다</div></div>

  // ---------- ACT 2 : 인프라 ----------
  twoLayers: ()=>`
    <div class="stage-eyebrow">ACT 2 · 인프라 <span class="tag">두 레이어</span></div>

      <div class="std">

  dvp: (revealed=99)=>`

  // ---------- ACT 3 : 토큰화·커스터디 ----------
  twoStandards: ()=>`
    <div class="stage-eyebrow">ACT 3 · 토큰화·커스터디 <span class="tag">두 질문</span></div>
    <div class="scene">
      <div class="big-q">필요한 건 <em>두 가지</em> 질문뿐</div>
      <p class="cap">앞의 규제와 결제 현실을 코드로 옮기면, 결국 두 개의 질문으로 요약됩니다. 각각을 담당할 토큰 표준이 하나씩 있습니다.</p>

        <div class="s who"><div class="qword">누가</div><div class="std-name">ERC-3643</div><div class="std-q">누가 보유·이전할 수 있는가</div>
          <ul><li>모든 이전에 신원·규칙 검사</li><li>키 분실 복구 · 동결 등 법적 기능</li></ul></div>
        <div class="x">×</div>
        <div class="s when"><div class="qword">언제</div><div class="std-name">ERC-7540</div><div class="std-q">발행·환매는 언제 확정되는가</div>
          <ul><li>1차 시장의 실물 결제 대기를 상태로 표현</li><li>결제 실패의 되돌림 경로</li></ul></div>
      </div>
    </div>`,

// ================= engine =================
let cur = -1;
const R = {shares:0, usdc:0, div:0, cap:32.0};
const $ = id=>document.getElementById(id);

function buildRail(){
  const rail=$("rail");rail.innerHTML="";
  for(let i=0;i<STEPS.length;i++){const s=document.createElement("div");s.className="seg";s.id="seg"+i;rail.appendChild(s);}
}
function fmt(n){return n.toLocaleString("en-US")}

function render(){
  // rail
  for(let i=0;i<STEPS.length;i++){const seg=$("seg"+i);seg.className="seg"+(i<cur?" done":i===cur?" active":"");}

  // controls
  $("prev").disabled = cur<0;
  $("next").textContent = cur>=STEPS.length-1 ? "완료 ✓" : (cur<0?"시작 →":"다음 →");
  $("next").disabled = cur>=STEPS.length-1;
  $("sc").textContent = cur<0?"":("단계 "+(cur+1)+" / "+STEPS.length);

  const st = cur<0 ? STEPS[0] : STEPS[cur];

  // act tabs
  const acts=document.querySelectorAll(".act-tab");
  acts.forEach((t,i)=>{
    t.classList.remove("on","done");
    const bar=t.querySelector(".bar");
    if(cur<0){bar.style.width="0";return;}
    if(i<st.act){t.classList.add("done");bar.style.width="100%";}
    else if(i===st.act){t.classList.add("on");
      // progress within act
      let seen=0,total=0;STEPS.forEach((s,idx)=>{if(s.act===i){total++;if(idx<=cur)seen++;}});
      bar.style.width=(seen/total*100)+"%";}
    else{bar.style.width="0";}
  });

  // narrative
  $("sn").textContent=st.sn;
  $("nh").textContent=st.nh;
  $("np").innerHTML=st.np.replace(/(ERC-3643|ERC-7540|ERC-20|ERC-4626|Chainlink CCIP|CCIP|KSD|DvP|OP Stack|Besu|Ondo|ADR|발행인계좌관리기관|전자등록계좌부|전자등록주식)/g,'<span class="fn">$1</span>');
  $("tfl").textContent=st.tfl;
  $("tft").textContent=st.tft;

  // stage scene
  if(st.scene){
    $("stage").innerHTML = SCENES[st.scene]();
  }
  // lifecycle steps reuse the lifecycle scene DOM; render actor state onto it
  if(st.active || st.state || st.scene==="lifecycle" || st.flow){
    renderLifecycle(st);
  }
}

function renderLifecycle(st){
  // ensure lifecycle DOM exists (steps after the lifecycle scene reuse it)
  if(!$("lanes")){ $("stage").innerHTML = SCENES.lifecycle(); }
  // reset
  document.querySelectorAll("#lanes .actor").forEach(a=>{a.classList.remove("active");a.classList.add("dim")});
  const fm=$("flowmsg"); if(fm)fm.classList.remove("show");
  const oc=$("offchain"); if(oc)oc.classList.remove("show");
  if($("gates"))$("gates").innerHTML="";
  if($("ocfill")){$("ocfill").style.width="0";$("oct").textContent="T+0";}

  // active actors
  (st.active||[]).forEach(a=>{const el=document.querySelector('#lanes .actor[data-actor="'+a+'"]');if(el){el.classList.add("active");el.classList.remove("dim");}});

  // apply metric changes
  if(st.set) Object.assign(R,st.set);
  updateMetrics();
  updateBalances(st.bal||{});

  // flow message
  if(st.flow && fm){fm.textContent=st.flow;positionFlow(st.active||[]);setTimeout(()=>fm.classList.add("show"),80);}

  // gates
  if(st.gates && $("gates")){st.gates.forEach((gt,i)=>{const d=document.createElement("div");d.className="gate "+gt[1];d.textContent=gt[0];$("gates").appendChild(d);setTimeout(()=>d.classList.add("show"),120+i*200);});}

  // offchain clock
  if(st.offchain && oc){$("oc-label").textContent=st.ocLabel||"T+2 · 환전";setTimeout(()=>oc.classList.add("show"),80);setTimeout(()=>{if($("ocfill"))$("ocfill").style.width="100%";},220);const seq=["T+0","T+1","T+2","결제 완료"];seq.forEach((lab,i)=>setTimeout(()=>{if($("oct"))$("oct").textContent=lab;},220+i*380));}
}

function positionFlow(acts){
  const map={investor:0,investor2:1,token:2,custodian:3};
  if(!acts.length)return;const idxs=acts.map(a=>map[a]).filter(x=>x!==undefined);if(!idxs.length)return;
  const mid=(Math.min(...idxs)+Math.max(...idxs))/2;$("flowmsg").style.left=((mid+0.5)/4*100)+"%";
}
function updateMetrics(){
  if(!$("m-shares"))return;
  $("m-shares").innerHTML=fmt(R.shares)+'<span class="u"> 주</span>';
  $("m-usdc").innerHTML=fmt(R.usdc)+'<span class="u"> USDC</span>';
  $("m-div").innerHTML=fmt(R.div)+'<span class="u"> USDC</span>';
  $("m-cap").innerHTML=R.cap.toFixed(1)+'<span class="u"> %</span>';
}
function updateBalances(bal){
  ["investor","investor2","token","custodian"].forEach(k=>{const el=$("bal-"+k);if(!el)return;
    if(bal[k]!==undefined){el.innerHTML=bal[k].replace(/(\+?[\d,]+ USDC|[\d,]+ 주)/g,'<b>$1</b>').replace(/(발행량 \d+|소유자 변경)/g,'<span class="tk">$1</span>');}
    else{el.innerHTML="";}});
}

// ---------- navigation ----------
function step(d){
  if(cur<0 && d<0) return;
  cur += d;
  if(cur<-1)cur=-1;
  if(cur>STEPS.length-1)cur=STEPS.length-1;
  render();
  scrollTop();
}
function reset(){cur=-1;R.shares=0;R.usdc=0;R.div=0;R.cap=32.0;render();scrollTop();}
function scrollTop(){ if(window.scrollY>140) window.scrollTo({top:0,behavior:"smooth"}); }

document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;
  if(e.key==="ArrowRight"){e.preventDefault();step(1);}
  if(e.key==="ArrowLeft"){e.preventDefault();step(-1);}
});

// clicking an act tab jumps to that act's first step
document.querySelectorAll(".act-tab").forEach(t=>{
  t.addEventListener("click",()=>{
    const a=+t.dataset.act;
    const idx=STEPS.findIndex(s=>s.act===a);
    if(idx>=0){cur=idx;render();scrollTop();}
  });
});

buildRail();
$("stage").innerHTML = SCENES.intro();
render();
</script>
